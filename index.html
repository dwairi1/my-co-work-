
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Cyber World</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080f1c;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #101d30;
            border-bottom: 1px solid #00e5a0;
        }

        h1 {
            color: #00e5a0;
            font-size: 32px;
        }

        .container {
            padding: 35px 15px;
        }

        .photo {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #00e5a0;
            box-shadow: 0 0 25px #00e5a055;
        }

        p {
            color: #b8c5d8;
            font-size: 17px;
        }

        button {
            background: #00e5a0;
            color: #08111e;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }

        button:hover {
            background: white;
        }

        .card {
            background: #101d30;
            margin: 30px auto;
            padding: 25px;
            max-width: 450px;
            border-radius: 15px;
            border: 1px solid #243b55;
        }

        footer {
            padding: 20px;
            color: #718096;
        }
    </style>
</head>

<body>

    <header>
        <h1>MY CYBER WORLD</h1>
        <p>Explore the world of technology</p>
    </header>

    <div class="container">

        <img
            src="Screenshot_20261102-160626~2.jpg"
            alt="My Photo"
            class="photo"
        >

        <h2>Welcome to My Website!</h2>

        <p>
            Learning Programming and Cybersecurity
        </p>

        <div class="card">
            <h2>About This Website</h2>

            <p>
                This is my first personal website.
                I am learning HTML, CSS and JavaScript.
            </p>

            <button onclick="showMessage()">
                Click Me
            </button>
        </div>

    </div>

    <footer>
        My Cyber World | 2026
    </footer>

    <script>
        function showMessage() {
            alert("Welcome to My Cyber World!");
        }
    </script>

</body>
</html>
